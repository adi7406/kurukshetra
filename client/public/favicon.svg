<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1121" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Brand Gradient for the Icon -->
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" rx="32" fill="url(#bg)" />

  <!-- MasterPath Icon Mark -->
  <g transform="translate(10, 15)">
    <!-- The 'M' Base Structure -->
    <path d="M20,120 L20,45 L65,90 L110,45 L110,120" 
          stroke="#1E293B" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- The 'P' Loop Structure -->
    <path d="M110,45 L150,45 C165,45 175,55 175,70 C175,85 165,95 150,95 L110,95" 
          stroke="#1E293B" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- The Growth/Adaptive Path (Cyan to Purple) -->
    <path d="M5,100 L40,65 L70,95 L120,45 L160,20" 
          stroke="url(#brand)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" 
          filter="url(#glow)" />
    
    <path d="M5,100 L40,65 L70,95 L120,45 L160,20" 
          stroke="url(#brand)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Arrow Head on the Growth Path -->
    <path d="M135,20 L160,20 L160,45" 
          stroke="url(#brand)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Data Nodes -->
    <circle cx="5" cy="100" r="7" fill="#06B6D4" />
    <circle cx="40" cy="65" r="7" fill="#0EA5E9" />
    <circle cx="70" cy="95" r="7" fill="#3B82F6" />
    <circle cx="120" cy="45" r="7" fill="#8B5CF6" />
  </g>
</svg>