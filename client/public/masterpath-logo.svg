<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1121" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Brand Gradient for the Icon -->
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" /> <!-- Cyan -->
      <stop offset="50%" stop-color="#6366F1" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#A855F7" /> <!-- Purple -->
    </linearGradient>

    <!-- Subtle Glow Filter for the neon aesthetic -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Dark Background with Rounded Corners -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg)" />

  <!-- Logo Group -->
  <g transform="translate(60, 45)">
    <!-- Icon Section -->
    <g transform="translate(0, 10)">
      <!-- The 'M' Base Structure -->
      <path d="M20,120 L20,45 L65,90 L110,45 L110,120" 
            stroke="#1E293B" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />
            
      <!-- The 'P' Loop Structure -->
      <path d="M110,45 L150,45 C165,45 175,55 175,70 C175,85 165,95 150,95 L110,95" 
            stroke="#1E293B" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />

      <!-- The Growth/Adaptive Path (Cyan to Purple) -->
      <path d="M5,100 L40,65 L70,95 L120,45 L160,20" 
            stroke="url(#brand)" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" 
            filter="url(#glow)" />
      
      <path d="M5,100 L40,65 L70,95 L120,45 L160,20" 
            stroke="url(#brand)" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />

      <!-- Arrow Head on the Growth Path -->
      <path d="M135,20 L160,20 L160,45" 
            stroke="url(#brand)" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />

      <!-- Data Nodes (Connecting the adaptive learning points) -->
      <circle cx="5" cy="100" r="7" fill="#06B6D4" />
      <circle cx="40" cy="65" r="7" fill="#0EA5E9" />
      <circle cx="70" cy="95" r="7" fill="#3B82F6" />
      <circle cx="120" cy="45" r="7" fill="#8B5CF6" />
    </g>

    <!-- Typography Section -->
    <g transform="translate(220, 90)">
      <!-- Main Brand Name -->
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
        Master<tspan fill="url(#brand)">Path</tspan>
      </text>
      
      <!-- Subtitle -->
      <text x="4" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" letter-spacing="3.2">
        ADAPTIVE LEARNING &amp; ASSESSMENT PORTAL
      </text>
    </g>
  </g>
</svg>
